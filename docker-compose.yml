services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Baked into the bundle at build time (Vite static replacement).
        # The substitution var is deliberately NOT named VITE_API_URL: Compose
        # auto-loads this directory's .env (Vite's dev file, which holds
        # VITE_API_URL=http://localhost:8080) for ${VAR} interpolation, so a
        # VITE_API_URL here leaked the dev URL into production builds and end
        # users' browsers hit ERR_CONNECTION_REFUSED on their own localhost.
        # Override per environment, e.g. FE_API_URL=https://api.example.com docker compose up --build
        VITE_API_URL: ${FE_API_URL:-https://legal-analyzer.lintasarta.dev}
    container_name: legpro-frontend
    restart: always
    ports:
      # nginx inside the container listens on 80 (see Dockerfile EXPOSE / nginx.conf).
      # Map the host port to 80 — NEVER to 5173; that was the old Vite dev-server
      # port and nothing listens there in this image.
      # Override the host side per environment via FE_PORT, e.g. FE_PORT=8081 docker compose up -d
      - "${FE_PORT:-80}:80"
    # NOTE: no bind-mounts, no CHOKIDAR/HMR vars — this serves the production
    # build via nginx. For local dev with HMR, run `npm run dev` directly instead.
