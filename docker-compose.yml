services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Baked into the bundle at build time (Vite static replacement).
        # Override per environment, e.g. VITE_API_URL=http://localhost:8000 docker compose up --build
        VITE_API_URL: ${VITE_API_URL:-https://legal-analyzer.lintasarta.dev}
    container_name: legpro-frontend
    restart: always
    ports:
      # nginx inside the container listens on 80 (see Dockerfile EXPOSE / nginx.conf).
      # Map the host port to 80 — NEVER to 5173; that was the old Vite dev-server
      # port and nothing listens there in this image.
      # Override the host side per environment via FE_PORT, e.g. FE_PORT=8081 docker compose up -d
      - "${FE_PORT:-80}:80"
    # NOTE: no bind-mounts, no CHOKIDAR/HMR vars — this serves the production
    # build via nginx. For local dev with HMR, run `npm run dev` directly instead.
