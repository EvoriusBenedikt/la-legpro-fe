# Production static server for the built Vite app (dist/).
# No HMR, no dev websocket — serves index.html with SPA fallback.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text payloads (the JS bundle dominates transfer size; hashed
    # assets are already immutable-cached so repeat visits skip the network).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Security headers. nginx add_header INHERITANCE GOTCHA: a location that
    # declares ANY add_header of its own inherits none from the server level,
    # so the three headers are repeated verbatim in each location below.
    # X-Frame-Options is SAMEORIGIN (not DENY) so same-origin test harnesses
    # can still embed the app while external framing stays blocked.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Reverse proxy for the API: same-origin deploys need no baked URL at all.
    # Without this block every POST /api/* hits the static file server and
    # nginx answers 405 (Not Allowed) - the deployed-login bug of 2026-10-02.
    # Longest-prefix matching keeps /api/* here and everything else on the SPA
    # fallback below. host.docker.internal reaches the backend's published
    # port on any Docker host (see extra_hosts in docker-compose.yml).
    location /api/ {
        proxy_pass http://host.docker.internal:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # PDF uploads ride POST /api/repository/*; LLM answers can take
        # minutes, so the read timeout must not cut them off.
        client_max_body_size 100m;
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # SPA fallback: let React Router handle client-side routes.
    # index.html must never be cached — it points at the hashed asset filenames,
    # so a stale index.html keeps users on an old (possibly broken) bundle after
    # a redeploy. Hashed /assets/ below are safe to cache for 1y.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed build assets (filenames contain content hashes)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
