# Production static server for the built Vite app (dist/).
# No HMR, no dev websocket — serves index.html with SPA fallback.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback: let React Router handle client-side routes
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Long-cache hashed build assets (filenames contain content hashes)
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
