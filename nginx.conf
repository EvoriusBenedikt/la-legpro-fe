# Production static server for the built Vite app (dist/).
# No HMR, no dev websocket — serves index.html with SPA fallback.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback: let React Router handle client-side routes.
  # index.html must never be cached — it points at the hashed asset filenames,
  # so a stale index.html keeps users on an old (possibly broken) bundle after
  # a redeploy. Hashed /assets/ below are safe to cache for 1y.
  location / {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri $uri/ /index.html;
  }

  # Long-cache hashed build assets (filenames contain content hashes)
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
